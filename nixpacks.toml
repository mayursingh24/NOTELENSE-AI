# Railway uses Nixpacks to build the image.
# ONLY system packages here — DO NOT override [phases.install]
# Nixpacks auto-detects requirements.txt and installs Python + pip automatically.
# Tesseract OCR and Poppler are needed for scanned PDF / image OCR support.

[phases.setup]
nixPkgs = ["tesseract", "poppler_utils"]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --timeout ${WEB_TIMEOUT:-120} app:app"
