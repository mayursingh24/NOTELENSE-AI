# Railway uses Nixpacks to build the image.
# Only system packages here — Python is auto-detected by Nixpacks from requirements.txt
# Tesseract OCR and Poppler are needed for scanned PDF / image support.

[phases.setup]
nixPkgs = ["tesseract", "poppler_utils"]

[phases.install]
cmds = ["python3 -m pip install --upgrade pip", "python3 -m pip install -r requirements.txt"]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-1} --timeout ${WEB_TIMEOUT:-120} app:app"
